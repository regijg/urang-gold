            # Replace environment variable in .env.local
            - sed -i 's|NEXT_PUBLIC_API_BASE_URL_ENV|https://api.umrohan.com/prd/|g' .env.local
            - npm run build

            # Login to ECR
            - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

            # Build and push Docker image
            - docker build -t $ECR_REPO:$BITBUCKET_COMMIT .
            - docker tag $ECR_REPO:$BITBUCKET_COMMIT $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:$BITBUCKET_COMMIT
            - docker push $ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:$BITBUCKET_COMMIT

      - step:
          name: Build and Deploy to Server
          caches:
            - node
          script:
            - pipe: atlassian/ssh-run:0.6.1
              variables:
                SSH_USER: 'ubuntu'
                SERVER: $SSH_HOSTNAME_DEV
